[project]
name = "fable-harness"
version = "0.1.0"
description = "Seat harness for Claude Code: Fable 5.2 advises or orchestrates, Opus 5.5 builds, Haiku 5.5 scouts, Jev gates."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# The hooks declare this again in their inline script metadata, because they run in the target repo.
dependencies = ["typesafe-sdk>=0.7.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "ty>=0.0.1a1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
